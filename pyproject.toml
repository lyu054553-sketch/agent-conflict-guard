[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-conflict-guard"
version = "0.1.0"
description = "Conflict detection and live monitoring for parallel AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["ai-agents", "multi-agent", "git", "merge-conflicts", "claude-code", "codex", "t3code"]

[project.scripts]
acg = "conflict_guard.cli:main"

[tool.setuptools]
packages = ["conflict_guard"]

[tool.setuptools.package-data]
conflict_guard = ["web/*.html"]
