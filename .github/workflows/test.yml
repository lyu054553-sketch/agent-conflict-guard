name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git version (merge-tree --write-tree needs git >= 2.38)
        run: git --version
      - name: unit tests
        run: python -m unittest discover -s tests -t tests -v
      - name: experiment smoke run
        run: python experiments/run_experiment.py --scenarios 20 --seed 1 --max-agents-latency 4 --out /tmp/acg-exp
